services:
  employees:
    image: pranitapandharinathpawar422/first:1.0.0
    container_name: employees
    ports:
      - 8090:8090
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - ems

  configserver:
    image: pranitapandharinathpawar422/config-server:1.0.1
    container_name: configserver
    ports:
      - 8071:8071
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/readiness | grep UP || exit 0"
      timeout: 10s
      retries: 5
      interval: 10s
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - ems


networks:
  ems:
    driver: "bridge"